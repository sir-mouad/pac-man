[project]
name = "pac-man"
version = "0.1.0"
description = "A polished Pygame Pac-Man arcade with a snapshot-driven frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "commentjson>=0.9.0",
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pygame>=2.6.1",
]

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]
